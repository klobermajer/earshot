name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/earshot.sh scripts/session-start.sh tests/run.sh
      - run: python3 -m py_compile scripts/mic-in-use.py
      - run: tests/run.sh
